[supervisord]
nodaemon=true

# (real subscriber):
[program:ros2_subscriber]
command=/bin/bash -c "source /opt/ros/humble/setup.bash && source /app/venv/bin/activate && source /app/ros2_ws/install/setup.bash && python /app/app/ros2_subscriber.py"
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stdout_logfile=/dev/stdout

# (sim subscriber)
; [program:generate_json]
; command=/bin/bash -c "source /opt/ros/humble/setup.bash && source /app/venv/bin/activate && source /app/ros2_ws/install/setup.bash && python /app/app/generate_json.py"
; autostart=true
; autorestart=true
; stderr_logfile=/dev/stderr
; stdout_logfile=/dev/stdout

[program:prometheus_exporter]
command=/bin/bash -c "source /opt/ros/humble/setup.bash && source /app/venv/bin/activate && source /app/ros2_ws/install/setup.bash && python /app/app/prometheus_exporter.py"
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stdout_logfile=/dev/stdout
